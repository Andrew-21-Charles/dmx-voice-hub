<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMX Voice Hub</title>
    <style>
        :root {
            --bg:       #0a0a12;
            --surface:  #12121e;
            --surface2: #1a1a2e;
            --cyan:     #00ffcc;
            --magenta:  #ff00aa;
            --red:      #ff4444;
            --text:     #e0e0e0;
            --dim:      #666688;
            --border:   #2a2a44;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ─────────────────────────────── */
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: var(--cyan);
            text-shadow: 0 0 12px var(--cyan);
        }
        .logo em {
            color: var(--magenta);
            text-shadow: 0 0 12px var(--magenta);
            font-style: normal;
        }

        #header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--dim);
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--dim);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .dot.on  { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: blink 2s infinite; }
        .dot.err { background: var(--red);  box-shadow: 0 0 8px var(--red); }

        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ── MAIN GRID ───────────────────────────── */
        main {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            max-width: 860px;
            margin: 0 auto;
            width: 100%;
        }

        /* ── CARD ────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        .card-title {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--dim);
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        /* ── BLE PANEL ───────────────────────────── */
        #ble-panel { grid-column: 1; }

        #connect-btn {
            width: 100%;
            padding: 13px;
            background: transparent;
            border: 2px solid var(--cyan);
            color: var(--cyan);
            font-family: inherit;
            font-size: 0.85rem;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            margin-bottom: 14px;
        }
        #connect-btn:hover       { background: rgba(0,255,204,.08); box-shadow: 0 0 14px rgba(0,255,204,.25); }
        #connect-btn.disco       { border-color: var(--red); color: var(--red); }
        #connect-btn.disco:hover { background: rgba(255,68,68,.08); box-shadow: 0 0 14px rgba(255,68,68,.25); }
        #connect-btn:disabled    { opacity: .35; cursor: not-allowed; }

        .info-row { font-size: 0.75rem; color: var(--dim); line-height: 2; }
        .info-row span { color: var(--text); }

        /* ── VOICE PANEL ─────────────────────────── */
        #voice-panel {
            grid-column: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #mic-btn {
            width: 96px; height: 96px;
            border-radius: 50%;
            background: var(--surface2);
            border: 3px solid var(--border);
            color: var(--dim);
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 14px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #mic-btn:hover         { border-color: var(--cyan); color: var(--cyan); }
        #mic-btn:disabled      { opacity: .3; cursor: not-allowed; }
        #mic-btn.active {
            border-color: var(--magenta);
            color: var(--magenta);
            box-shadow: 0 0 24px rgba(255,0,170,.45);
            animation: micpulse 1s infinite;
        }
        @keyframes micpulse {
            0%,100%{ box-shadow: 0 0 20px rgba(255,0,170,.4); }
            50%    { box-shadow: 0 0 38px rgba(255,0,170,.75); }
        }

        #mic-hint {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--dim);
            margin-bottom: 14px;
        }

        #transcript {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            min-height: 44px;
            font-size: 0.82rem;
            color: var(--dim);
            font-style: italic;
            text-align: center;
            transition: border-color 0.2s, color 0.2s;
        }
        #transcript.active {
            border-color: var(--cyan);
            color: var(--cyan);
            transition: border-color 0.2s, color 0.2s, background 0.6s;
        }

        /* ── QUICK COMMANDS ──────────────────────── */
        #quick-panel { grid-column: 1 / -1; }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .qbtn {
            padding: 16px 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.78rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.18s;
            display: flex; flex-direction: column;
            align-items: center; gap: 7px;
        }
        .qbtn .icon { font-size: 1.5rem; }
        .qbtn .kw   { font-size: 0.62rem; color: var(--dim); }
        .qbtn:hover  { border-color: var(--cyan); background: rgba(0,255,204,.05); }
        .qbtn:active { transform: scale(.96); }
        .qbtn:disabled { opacity: .3; cursor: not-allowed; }

        /* ── LOG PANEL ───────────────────────────── */
        #log-panel { grid-column: 1 / -1; }

        .log-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px;
        }
        .clear-btn {
            font-size: 0.65rem; letter-spacing: 1px;
            color: var(--dim); background: none; border: none;
            cursor: pointer; font-family: inherit;
        }
        .clear-btn:hover { color: var(--text); }

        #log {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column-reverse;
            gap: 3px;
        }

        .entry {
            font-size: 0.75rem;
            padding: 2px 8px;
            margin-bottom: 3px;
            border-left: 2px solid var(--border);
            line-height: 1.5;
        }
        .entry.sent  { border-color: var(--cyan);   color: var(--cyan); }
        .entry.err   { border-color: var(--red);    color: var(--red); }
        .entry.info  { border-color: var(--border); color: var(--dim); }
        .entry .ts   { opacity: .45; margin-right: 8px; }

        /* ── FOOTER ──────────────────────────────── */
        footer {
            text-align: center;
            padding: 10px;
            font-size: 0.65rem;
            color: var(--dim);
            border-top: 1px solid var(--border);
            letter-spacing: 1px;
        }

        /* ── SCROLLBAR ───────────────────────────── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--surface2); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ── MOBILE RESPONSIVE ADAPTATIONS ───────── */
        @media (max-width: 600px) {
            main {
                grid-template-columns: 1fr;
            }
            #ble-panel, #voice-panel {
                grid-column: 1;
            }
            .quick-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

<!-- ═══ HEADER ═══════════════════════════════════ -->
<header>
    <div class="logo">⚡ DMX <em>VOICE</em> HUB</div>
    <div id="header-status">
        <div class="dot" id="dot"></div>
        <span id="status-lbl">DISCONNECTED</span>
    </div>
</header>

<!-- ═══ MAIN ══════════════════════════════════════ -->
<main>

    <!-- BLE Connection Card -->
    <div class="card" id="ble-panel">
        <div class="card-title">Bluetooth Connection</div>
        <button id="connect-btn" onclick="toggleConnect()">[ CONNECT ]</button>
        <div class="info-row">
            Device &nbsp;: <span id="i-name">—</span><br>
            State &nbsp;&nbsp;: <span id="i-state">idle</span>
        </div>
    </div>

    <!-- Voice Control Card -->
    <div class="card" id="voice-panel">
        <div class="card-title">Voice Command</div>
        <button id="mic-btn" onclick="toggleListen()" disabled title="Connect to ESP32 first">🎤</button>
        <div id="mic-hint">CONNECT FIRST</div>
        <div id="transcript">awaiting voice input...</div>
    </div>

    <!-- Quick Commands Card -->
    <div class="card" id="quick-panel">
        <div class="card-title">Quick Commands</div>
        <div class="quick-grid">
            <button class="qbtn" data-cmd="scene 1" onclick="qSend(this)" disabled>
                <span class="icon">🎉</span>
                <span>SCENE 1</span>
                <span class="kw">"party"</span>
            </button>
            <button class="qbtn" data-cmd="white" onclick="qSend(this)" disabled>
                <span class="icon">💡</span>
                <span>WHITE</span>
                <span class="kw">"white"</span>
            </button>
            <button class="qbtn" data-cmd="blue" onclick="qSend(this)" disabled>
                <span class="icon">🔵</span>
                <span>BLUE</span>
                <span class="kw">"blue"</span>
            </button>
            <button class="qbtn" data-cmd="blackout" onclick="qSend(this)" disabled>
                <span class="icon">⚫</span>
                <span>BLACKOUT</span>
                <span class="kw">"off"</span>
            </button>
        </div>
    </div>

    <!-- Command Log Card -->
    <div class="card" id="log-panel">
        <div class="log-header">
            <div class="card-title" style="margin:0">Command Log</div>
            <button class="clear-btn" onclick="clearLog()">[ clear ]</button>
        </div>
        <div id="log"></div>
    </div>

</main>

<footer>REQUIRES GOOGLE CHROME &nbsp;·&nbsp; Web Bluetooth + Speech Recognition &nbsp;·&nbsp; ESP32-S3 DMX Controller</footer>

<!-- ═══ JAVASCRIPT ═════════════════════════════════ -->
<script>
function initSpeechEngine() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;

    const r = new SR();
    // Setting continuous to false makes mobile Chrome yield results much faster and more reliably
    r.continuous      = false;  
    r.interimResults  = true;  
    r.lang            = 'en-US'; // Hardcode to match spoken English commands
    r.maxAlternatives = 1;

    let lastSentCommand = "";
    let commandTimer = null;

    r.onstart = () => {
        transcriptEl.textContent = 'Listening...';
        transcriptEl.classList.add('active');
        transcriptEl.style.fontStyle = 'italic';
        lastSentCommand = "";
    };

    r.onresult = (ev) => {
        let transcriptText = '';

        for (let i = ev.resultIndex; i < ev.results.length; i++) {
            transcriptText += ev.results[i][0].transcript;
        }

        const cmd = transcriptText.toLowerCase().trim();

        if (cmd) {
            transcriptEl.textContent = '"' + cmd + '"';
            transcriptEl.style.fontStyle = 'normal';

            // Auto-send command after a brief pause in speaking
            clearTimeout(commandTimer);
            commandTimer = setTimeout(() => {
                if (cmd !== lastSentCommand && isUserListening) {
                    lastSentCommand = cmd;
                    flashSent(transcriptEl);
                    send(cmd);
                }
            }, 500); 
        }
    };

    r.onerror = (ev) => {
        if (ev.error === 'no-speech' || ev.error === 'aborted') return;
        addLog('Mic error: ' + ev.error, 'err');
    };

    r.onend = () => {
        // Continuous auto-restart loop for mobile
        if (isUserListening) {
            clearTimeout(restartDelay);
            restartDelay = setTimeout(() => {
                if (isUserListening) {
                    try { 
                        r.start(); 
                    } catch (e) {
                        // Engine restarting
                    }
                }
            }, 100);
        }
    };

    return r;
}
</script>
</body>
</html>
